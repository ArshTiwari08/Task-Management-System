<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ledger — Task Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <!-- ===== Header ===== -->
  <header class="header">
    <div class="header-title">
      <span class="header-mark">§</span>
      <div>
        <h1>Ledger</h1>
        <p class="header-sub">your daily task register</p>
      </div>
    </div>

    <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode" title="Toggle theme">
      <svg id="iconSun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="12" cy="12" r="4"></circle>
        <line x1="12" y1="1.5" x2="12" y2="4"></line>
        <line x1="12" y1="20" x2="12" y2="22.5"></line>
        <line x1="4.2" y1="4.2" x2="6" y2="6"></line>
        <line x1="18" y1="18" x2="19.8" y2="19.8"></line>
        <line x1="1.5" y1="12" x2="4" y2="12"></line>
        <line x1="20" y1="12" x2="22.5" y2="12"></line>
        <line x1="4.2" y1="19.8" x2="6" y2="18"></line>
        <line x1="18" y1="6" x2="19.8" y2="4.2"></line>
      </svg>
      <svg id="iconMoon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="display:none">
        <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.8 6.8 0 0 0 10.5 10.5z"></path>
      </svg>
    </button>
  </header>

  <!-- ===== Ledger strip: stats + progress ===== -->
  <section class="ledger-strip">
    <div class="stat-block">
      <span class="stat-num" id="statTotal">0</span>
      <span class="stat-label">total</span>
    </div>
    <div class="stat-divider"></div>
    <div class="stat-block">
      <span class="stat-num" id="statActive">0</span>
      <span class="stat-label">pending</span>
    </div>
    <div class="stat-divider"></div>
    <div class="stat-block">
      <span class="stat-num" id="statDone">0</span>
      <span class="stat-label">complete</span>
    </div>

    <div class="progress-wrap">
      <div class="progress-head">
        <span>Completion</span>
        <span id="progressPct">0%</span>
      </div>
      <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progressTrack">
        <div class="progress-fill" id="progressFill"></div>
        <div class="progress-ticks" id="progressTicks"></div>
      </div>
    </div>
  </section>

  <!-- ===== Task entry form ===== -->
  <section class="entry-card">
    <form id="taskForm" class="entry-form">
      <input type="text" id="taskInput" class="task-input" placeholder="Write a new entry…" autocomplete="off" required maxlength="140">

      <div class="entry-row">
        <div class="field">
          <label for="dueDate">Due</label>
          <input type="date" id="dueDate">
        </div>

        <div class="field">
          <label for="priority">Priority</label>
          <select id="priority">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
          </select>
        </div>

        <div class="field">
          <label for="category">Category</label>
          <select id="category">
            <option value="general">General</option>
            <option value="work">Work</option>
            <option value="personal">Personal</option>
            <option value="study">Study</option>
            <option value="errand">Errand</option>
          </select>
        </div>

        <button type="submit" class="btn-add">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          Add entry
        </button>
      </div>
    </form>
  </section>

  <!-- ===== Controls: search / filter / sort / clear ===== -->
  <section class="controls">
    <div class="search-box">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <input type="text" id="searchInput" placeholder="Search entries…">
    </div>

    <div class="filter-tabs" id="filterTabs">
      <button class="tab active" data-filter="all">All</button>
      <button class="tab" data-filter="pending">Pending</button>
      <button class="tab" data-filter="completed">Completed</button>
    </div>

    <select id="categoryFilter" class="mini-select">
      <option value="all">All categories</option>
      <option value="general">General</option>
      <option value="work">Work</option>
      <option value="personal">Personal</option>
      <option value="study">Study</option>
      <option value="errand">Errand</option>
    </select>

    <button class="btn-clear" id="clearAllBtn">Clear all</button>
  </section>

  <!-- ===== Task list ===== -->
  <section class="list-card">
    <ul id="taskList" class="task-list"></ul>
    <div class="empty-state" id="emptyState">
      <span class="empty-mark">§</span>
      <p>The ledger is empty.</p>
      <p class="empty-sub">Add your first entry above — drag rows to reorder.</p>
    </div>
  </section>

  <footer class="footer">
    <span>Drag the <strong>⠿</strong> handle to reorder entries · data saved to this browser only</span>
  </footer>

</div>

<!-- Edit Modal -->
<div class="modal-overlay" id="editModalOverlay">
  <div class="modal">
    <h2>Edit entry</h2>
    <form id="editForm">
      <input type="hidden" id="editId">
      <label for="editText">Task</label>
      <input type="text" id="editText" required maxlength="140">

      <div class="entry-row">
        <div class="field">
          <label for="editDue">Due</label>
          <input type="date" id="editDue">
        </div>
        <div class="field">
          <label for="editPriority">Priority</label>
          <select id="editPriority">
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
          </select>
        </div>
        <div class="field">
          <label for="editCategory">Category</label>
          <select id="editCategory">
            <option value="general">General</option>
            <option value="work">Work</option>
            <option value="personal">Personal</option>
            <option value="study">Study</option>
            <option value="errand">Errand</option>
          </select>
        </div>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn-secondary" id="cancelEdit">Cancel</button>
        <button type="submit" class="btn-add">Save changes</button>
      </div>
    </form>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
