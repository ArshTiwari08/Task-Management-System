<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task- Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="dash">
  <!-- tool bar -->
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">@</span>
      <span class="brand-name">Task Manager</span>
    </div>
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode" title="Toggle theme">
      <svg id="iconSun" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="12" cy="12" r="4"></circle>
        <line x1="12" y1="1.5" x2="12" y2="4"></line><line x1="12" y1="20" x2="12" y2="22.5"></line>
        <line x1="4.2" y1="4.2" x2="6" y2="6"></line><line x1="18" y1="18" x2="19.8" y2="19.8"></line>
        <line x1="1.5" y1="12" x2="4" y2="12"></line><line x1="20" y1="12" x2="22.5" y2="12"></line>
        <line x1="4.2" y1="19.8" x2="6" y2="18"></line><line x1="18" y1="6" x2="19.8" y2="4.2"></line>
      </svg>
      <svg id="iconMoon"  width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="display:none">
        <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.8 6.8 0 0 0 10.5 10.5z"></path>
      </svg>
    </button>
  </header>
  <!-- State card -->
    <section class="stat-grid">
    <div class="stat-card">
      <div class="stat-icon i-total">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 11H5a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h4"></path><path d="M9 11V6a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-6"></path></svg>
      </div>
      <div><span class="stat-num" id="statTotal">0</span><span class="stat-label">Total</span></div>
    </div>
    <div class="stat-card">
      <div class="stat-icon i-pending">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><polyline points="12 7 12 12 15.5 14"></polyline></svg>
      </div>
      <div><span class="stat-num" id="statActive">0</span><span class="stat-label">Pending</span></div>
    </div>
    <div class="stat-card">
      <div class="stat-icon i-done">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 6 9 17l-5-5"></path></svg>
      </div>
      <div><span class="stat-num" id="statDone">0</span><span class="stat-label">Done</span></div>
    </div>
    <div class="stat-card stat-progress">
      <div class="progress-head"><span>Progress</span><span id="progressPct">0%</span></div>
      <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progressTrack">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>
  </section>

  <!-- Main Grid -->
    <div class="main-grid">

    <!-- Sidebar -->
    <aside class="sidebar">

      <div class="panel">
        <h3 class="panel-title">New task</h3>
        <form id="taskForm" class="entry-form">
          <input type="text" id="taskInput" class="task-input" placeholder="Task name…" autocomplete="off" required maxlength="140">

          <div class="field">
            <label for="dueDate">Due date</label>
            <input type="date" id="dueDate">
          </div>
          <div class="field">
            <label for="priority">Priority</label>
            <select id="priority">
              <option value="low">Low</option>
              <option value="medium" selected>Medium</option>
              <option value="high">High</option>
            </select>
          </div>
          <div class="field">
            <label for="category">Category</label>
            <select id="category">
              <option value="general">General</option>
              <option value="work">Work</option>
              <option value="personal">Personal</option>
              <option value="study">Study</option>
              <option value="errand">Errand</option>
            </select>
          </div>

          <button type="submit" class="btn-add">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            Add task
          </button>
        </form>
      </div>

      <div class="panel">
        <h3 class="panel-title">Filters</h3>

        <div class="search-box">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input type="text" id="searchInput" placeholder="Search…">
        </div>

        <div class="filter-tabs" id="filterTabs">
          <button class="tab active" data-filter="all">All</button>
          <button class="tab" data-filter="pending">Pending</button>
          <button class="tab" data-filter="completed">Done</button>
        </div>

        <div class="field">
          <label for="categoryFilter">Category</label>
          <select id="categoryFilter" class="mini-select">
            <option value="all">All categories</option>
            <option value="general">General</option>
            <option value="work">Work</option>
            <option value="personal">Personal</option>
            <option value="study">Study</option>
            <option value="errand">Errand</option>
          </select>
        </div>

        <button class="btn-clear" id="clearAllBtn">Clear all tasks</button>
      </div>

    </aside>

    <!-- Task list -->
    <main class="list-card">
      <div class="list-head">
        <h3 class="panel-title">Tasks</h3>
        <span class="list-hint">drag # to reorder</span>
      </div>
      <ul id="taskList" class="task-list"></ul>
      <div class="empty-state" id="emptyState">
        <span class="empty-mark">#</span>
        <p>No tasks here.</p>
        <p class="empty-sub">Add one from the sidebar.</p>
      </div>
    </main>
  </div>
</div>

<!-- Edit Model -->
 <div class="modal-overlay" id="editModalOverlay">
  <div class="modal">
    <h2>Edit task</h2>
    <form id="editForm">
      <input type="hidden" id="editId">
      <label for="editText">Task</label>
      <input type="text" id="editText" required maxlength="140">

      <div class="entry-row">
        <div class="field">
          <label for="editDue">Due</label>
          <input type="date" id="editDue">
        </div>
        <div class="field">
          <label for="editPriority">Priority</label>
          <select id="editPriority">
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
          </select>
        </div>
        <div class="field">
          <label for="editCategory">Category</label>
          <select id="editCategory">
            <option value="general">General</option>
            <option value="work">Work</option>
            <option value="personal">Personal</option>
            <option value="study">Study</option>
            <option value="errand">Errand</option>
          </select>
        </div>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn-secondary" id="cancelEdit">Cancel</button>
        <button type="submit" class="btn-add">Save changes</button>
      </div>
    </form>
  </div>
</div>
</body>
<script src="script.js"></script>
</html>
